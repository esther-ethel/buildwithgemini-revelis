<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revelis – Autonomous Celebration Concierge</title>
<!-- Google Fonts: Outfit for luxury headings, Plus Jakarta Sans for body -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<!-- Marked.js library for Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --accent: #C2410C;
    --accent-hover: #9A3412;
    --accent-gradient: linear-gradient(135deg, #C2410C 0%, #E11D48 100%);
    --bg: #FAFAF9;
    --header-bg: #1C1917;
    --header-text: #F5F5F4;
    --card-bg: #FFFFFF;
    --border: #E7E5E4;
    --text-primary: #1C1917;
    --text-secondary: #78716C;
    --shadow-sm: 0 1px 3px rgba(28,25,23,0.06);
    --shadow-md: 0 4px 12px rgba(28,25,23,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 1.1rem 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  header h1 {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #FDE68A 0%, #F43F5E 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    margin: 0.25rem 0 0 0;
    font-size: 0.85rem;
    color: #A8A29E;
    font-weight: 400;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    margin: 1rem 0;
    display: flex;
    flex-direction: column;
  }
  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .bubble {
    display: inline-block;
    padding: 0.85rem 1.15rem;
    border-radius: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    text-align: left;
    max-width: 88%;
    line-height: 1.55;
    font-size: 0.95rem;
  }
  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #FFFFFF;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 3px 10px rgba(194, 65, 12, 0.25);
    white-space: pre-wrap;
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Markdown Body Styling */
  .markdown-body {
    line-height: 1.6;
    color: var(--text-primary);
  }
  .markdown-body p { margin: 0 0 0.5rem 0; }
  .markdown-body p:last-child { margin-bottom: 0; }
  .markdown-body ul, .markdown-body ol { margin: 0.4rem 0 0.6rem 1.25rem; padding: 0; }
  .markdown-body li { margin-bottom: 0.25rem; }
  .markdown-body strong { font-weight: 600; color: #1C1917; }
  .markdown-body code { background: #F5F5F4; padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.88em; font-family: monospace; }
  .markdown-body pre { background: #1C1917; color: #F5F5F4; padding: 0.75rem 1rem; border-radius: 8px; overflow-x: auto; margin: 0.5rem 0; }
  .markdown-body pre code { background: transparent; padding: 0; color: inherit; }

  .footer-container {
    border-top: 1px solid var(--border);
    background: var(--card-bg);
  }

  .chips-container {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0.75rem 1.5rem 0.25rem;
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips-container::-webkit-scrollbar { display: none; }
  .chip {
    background: #F5F5F4;
    border: 1px solid #E7E5E4;
    color: #44403C;
    padding: 0.5rem 0.9rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .chip:hover {
    background: #FFF7ED;
    border-color: #FDBA74;
    color: #C2410C;
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  form {
    display: flex;
    gap: 0.75rem;
    padding: 0.75rem 1.5rem 1rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #FAFAF9;
    transition: all 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    background: #FFFFFF;
    box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.12);
  }
  button[type="submit"] {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: var(--accent-gradient);
    color: #FFFFFF;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
    box-shadow: 0 2px 6px rgba(194, 65, 12, 0.3);
  }
  button[type="submit"]:hover { opacity: 0.92; transform: translateY(-1px); }
  button[type="submit"]:active { transform: translateY(0); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
    transition: all 0.2s ease;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; color: #1C1917; }
  .a2text.a2-h2 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; color: #292524; }
  .a2text.a2-h3 { font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 600; color: #44403C; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; object-fit: cover; box-shadow: var(--shadow-sm); margin-top: 0.4rem; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Revelis – Autonomous Celebration Concierge</h1>
  <p>Context-aware itinerary planning, custom culinary visuals, and event logistics</p>
</header>

<div id="log"></div>

<div class="footer-container">
  <div class="chips-container">
    <button type="button" class="chip" data-prompt="🌴 Plan a 3-day Scottsdale Desert Disco weekend">🌴 Plan a 3-day Scottsdale Desert Disco weekend</button>
    <button type="button" class="chip" data-prompt="🍸 Design a custom signature cocktail & cake mockup">🍸 Design a custom signature cocktail & cake mockup</button>
    <button type="button" class="chip" data-prompt="📊 Calculate per-person budget splits for 8 guests">📊 Calculate per-person budget splits for 8 guests</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask Revelis to plan your celebration…" autocomplete="off" autofocus>
    <button type="submit">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const prompt = chip.getAttribute("data-prompt");
    if (prompt) {
      input.value = prompt;
      form.requestSubmit();
    }
  });
});

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      
      const val = boundStr(props.text);
      if (typeof marked !== "undefined" && typeof marked.parse === "function") {
        t.innerHTML = marked.parse(val);
      } else {
        t.textContent = val;
      }
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function convertVideoUrlsToElements(container) {
  const mp4Regex = /(https?:\/\/[^\s"'<>]+\.mp4[^\s"'<>]*)/gi;
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
  const nodesToReplace = [];
  let node;
  while ((node = walker.nextNode())) {
    if (mp4Regex.test(node.nodeValue)) {
      nodesToReplace.push(node);
    }
  }
  for (const textNode of nodesToReplace) {
    const parent = textNode.parentNode;
    if (parent && (parent.tagName === 'SOURCE' || parent.tagName === 'VIDEO')) continue;
    const text = textNode.nodeValue;
    const frag = document.createDocumentFragment();
    let lastIdx = 0;
    text.replace(mp4Regex, (match, url, offset) => {
      frag.appendChild(document.createTextNode(text.slice(lastIdx, offset)));
      const video = document.createElement('video');
      video.controls = true;
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      video.style.width = '100%';
      video.style.borderRadius = '12px';
      video.style.marginTop = '8px';
      video.style.boxShadow = '0 2px 8px rgba(0,0,0,0.1)';
      const source = document.createElement('source');
      source.src = url;
      source.type = 'video/mp4';
      video.appendChild(source);
      frag.appendChild(video);
      lastIdx = offset + match.length;
    });
    frag.appendChild(document.createTextNode(text.slice(lastIdx)));
    if (parent) parent.replaceChild(frag, textNode);
  }
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    if (typeof marked !== "undefined" && typeof marked.parse === "function") {
      const wrapper = el("div", "markdown-body");
      wrapper.innerHTML = marked.parse(textStr);
      b.appendChild(wrapper);
    } else {
      b.appendChild(el("div", null, textStr));
    }
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      const flat = flattenText(a2ui);
      if (flat && typeof marked !== "undefined" && typeof marked.parse === "function") {
        const wrapper = el("div", "markdown-body");
        wrapper.innerHTML = marked.parse(flat);
        b.appendChild(wrapper);
      } else {
        b.appendChild(el("div", null, flat || "(no card content)"));
      }
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  convertVideoUrlsToElements(b);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
